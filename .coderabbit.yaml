# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review configuration: settings only. The review rules live in
# REVIEW.md and the coding rules in AGENTS.md. CodeRabbit reads both as code
# guidelines (the default file patterns include **/REVIEW.md and **/AGENTS.md),
# so they are not repeated here. Devin Review reads the same two files.
language: en-US
knowledge_base:
  code_guidelines:
    enabled: true
early_access: false
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: true
  tools:
    golangci-lint:
      enabled: true
    gitleaks:
      enabled: true
    markdownlint:
      enabled: false
chat:
  auto_reply: true
