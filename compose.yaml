services:
  redis:
    image: redis:8
    container_name: iq-redis
    ports:
      - "6379:6379"
    # Ephemeral test instance: no persistence to disk.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:8
    container_name: iq-mongo
    ports:
      - "27017:27017"
    # Ephemeral test instance: no auth, data lives only in the container.
    command: ["--quiet"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 5

  cassandra:
    image: cassandra:5
    container_name: iq-cassandra
    ports:
      - "9042:9042"
    # Ephemeral single-node test instance; data lives only in the container.
    # Cassandra is slow to become ready, so the healthcheck retries generously.
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 60s
