# One fixed project name for every worktree: container names (iq-*) and host ports already
# serialize integration runs to a single stack, so per-worktree project names only pile up
# throwaway `<name>_default` networks that exhaust Docker's address pool. Pin it to one stack.
name: iq

# This file is the one source of the test images. Each image is a version tag plus the
# digest of its multi-arch index. HBase is the exception: its image publishes no patch
# tags and no index, so its digest names a linux/amd64 manifest. The Go tests read the
# image through internal/testimage. To change a version, change the tag and the digest
# together.

services:
  redis:
    image: redis:8.10.2@sha256:c94085d298b738be22c9ccdc0ac3761fa6649df7dd82ad1d42367f3cb9714935
    container_name: iq-redis
    ports:
      - "6379:6379"
    # Ephemeral test instance: no persistence to disk.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5

  # MongoDB 8.3 and 9.0 do not start on Linux kernel 6.19 or newer (SERVER-121912).
  # The CI runners and current developer hosts run such a kernel, so the image stays
  # on 8.2. renovate.json holds it below 8.3.
  mongo:
    image: mongo:8.2.12@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    container_name: iq-mongo
    ports:
      - "27017:27017"
    # Ephemeral test instance: no auth, data lives only in the container.
    command: ["--quiet"]
    # WiredTiger opens one file for each collection and index. A long scan hit the
    # default limit of 1024 open files, and the container exited with code 139.
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 5

  cassandra:
    image: cassandra:5.0.9@sha256:618a493bcf1f817ea2f07288a46fa76fb2d9c4dfd5a04c28227336405782889c
    container_name: iq-cassandra
    ports:
      - "9042:9042"
    # Ephemeral single-node test instance; data lives only in the container.
    # Cassandra is slow to become ready, so the healthcheck retries generously.
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 60s

  dynamodb:
    image: amazon/dynamodb-local:3.3.2@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
    container_name: iq-dynamodb
    ports:
      - "8000:8000"
    # Ephemeral in-memory instance: no data persisted to disk.
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory"]
    # No healthcheck: the image ships no shell HTTP client, and DynamoDB Local is
    # serving within a second of start. scripts/seed-dynamodb.sh does its own
    # reachability check with the AWS CLI before seeding.

  hbase:
    image: harisekhon/hbase:2.1@sha256:c65ce56799f59fab86eb8995a628c878c28c03189c0fd27285c6ebef4cb016fa
    container_name: iq-hbase
    # Native HBase RPC hands the client the region server's *advertised* hostname, so
    # the client must reach the server by that name. Host networking makes ZooKeeper,
    # the master, and the region server all reachable on localhost under the hostname
    # the host already resolves — the simplest reliable setup for a host-side gohbase
    # client (random published ports would break the name the region server hands back).
    # It binds ZooKeeper 2181 and the HBase ports (16000/16010/16020/16030) on the host.
    # Ephemeral single-node instance; data lives only in the container.
    network_mode: host
    # HBase on a JVM is slow to become ready, so the healthcheck retries generously.
    healthcheck:
      test: ["CMD-SHELL", "echo 'status' | hbase shell -n 2>/dev/null | grep -q 'active master'"]
      interval: 5s
      timeout: 20s
      retries: 30
      start_period: 90s

  couchdb:
    image: couchdb:3.5.2.1@sha256:5fc596110eac7f412173a7d9de14f70aa5d3e816790fb6e70642755d4a4cf464
    container_name: iq-couchdb
    ports:
      - "5984:5984"
    # Ephemeral single-node test instance; the admin credentials configure single
    # node mode and data lives only in the container.
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    healthcheck:
      # /_up is CouchDB's public readiness endpoint; the image ships curl.
      test: ["CMD", "curl", "-fsS", "http://localhost:5984/_up"]
      interval: 2s
      timeout: 5s
      retries: 15

  couchbase:
    image: couchbase:community-8.0.2@sha256:0470d32422aa8b64e3d422f02466327c76b577c8ff72a6c0bc10fc90c84779ce
    container_name: iq-couchbase
    ports:
      # 8091-8096 are the cluster/management + service REST ports; 11210 is the KV
      # (memcached) protocol port the SDK connects on.
      - "8091-8096:8091-8096"
      - "11210:11210"
    # The stock image starts unprovisioned; scripts/seed-couchbase.sh runs the one-time
    # idempotent cluster-init, bucket, index, and sample docs. The healthcheck only
    # asserts the management port answers, so `--wait` returns once the server is up.
    healthcheck:
      # Assert the management port answers, not that the request authorizes: after the
      # seed script's cluster-init, /pools returns 401 without credentials, which is
      # still the server answering — so drop -f (which fails on any 4xx) and just
      # confirm the HTTP endpoint responds. A connection refusal still exits non-zero.
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://localhost:8091/pools"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s

  neo4j:
    image: neo4j:5.26.31@sha256:c7d25c0eeebfe125718d58b72ed5d663c85d0479047733845eb2237c67ce8069
    container_name: iq-neo4j
    ports:
      - "7687:7687"
      - "7474:7474"
    # Ephemeral single-node test instance; data lives only in the container. The
    # admin password is set here so cypher-shell and the driver can authenticate.
    environment:
      NEO4J_AUTH: neo4j/password
    # Neo4j on a JVM is slow to become ready, so the healthcheck retries generously.
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5@sha256:13b4a40bb095774f5fda635e45fd5677cc6a26565e42b24997b0c72b88e75984
    container_name: iq-elasticsearch
    ports:
      - "9200:9200"
    # Ephemeral single-node test instance; data lives only in the container. Security
    # is disabled so a host-side client connects over plain HTTP with no credentials,
    # and the JVM heap is capped so the container is light to run locally.
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      # A CI runner's disk sits past the flood-stage watermark, which leaves new
      # shards unassigned and every write waiting; the instance is ephemeral.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    # Elasticsearch on a JVM is slow to become ready, so the healthcheck retries generously.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 60s

  opensearch:
    image: opensearchproject/opensearch:3.9.0@sha256:adfa61f85025d06b4aeb562e7e74fde7e31c437039c93c3862c17e9acebd6c7c
    container_name: iq-opensearch
    ports:
      - "9201:9200"
    # Ephemeral single-node test instance; data lives only in the container. The
    # security plugin is disabled so a host-side client connects over plain HTTP with
    # no credentials, and the JVM heap is capped so the container is light to run
    # locally. Published on 9201 so it does not collide with Elasticsearch on 9200.
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      # Same as elasticsearch: past the flood stage OpenSearch blocks index creation.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    # OpenSearch on a JVM is slow to become ready, so the healthcheck retries generously.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 60s

networks:
  # Pin the bridge to a subnet outside the LAN (192.168.0.0/16), the VM NAT (10.0.2.0/24), and
  # Docker's default pool (172.16.0.0/12), so an auto-assigned subnet can never mask a LAN host
  # (for example the git origin on the LAN). Services are reached via published localhost
  # ports, so the subnet is otherwise invisible.
  default:
    ipam:
      config:
        - subnet: 10.100.0.0/24
