# Posts a link to the Devin Review of each new pull request. The link
# gives Devin no access to the repository: Devin Review reads public pull
# requests without an account. The workflow uses pull_request_target so that it
# can also comment on a pull request from a fork. The job does not check out
# the pull request and does not put pull request data into a shell command.
# It gets only the pull request number, from the event, through an environment
# variable.
name: Devin Review link

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout, no pull request data in a shell, only the number from the event
    types: [opened]

permissions: {}

jobs:
  comment:
    if: github.repository == 'zsltg/iq'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # post the comment
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Post the Devin Review link
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" -R "$REPO" --body "Devin Review of this pull request: https://devinreview.com/$REPO/pull/$PR"
