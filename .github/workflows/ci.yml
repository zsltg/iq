# GitHub Actions syntax. The primary remote is a self-hosted git server with Actions off,
# so this file runs only on the GitHub mirror (release.yml and docs.yml share that
# guard style). golangci-lint installs via `go install`, and every other tool runs via
# `go run <module>@<version>` or through the repo's own wrappers (which provision
# their pinned mutago/capslock into a throwaway GOBIN), so nothing touches go.mod.
# The tool versions live in scripts/tool-versions.env. Each step that runs a tool
# sources that file first.
#
# Every job that needs Go runs actions/checkout first and then the shared action
# .github/actions/setup-go. The action installs Go and restores one Go cache (the
# module cache and the build cache). The order matters, because the cache key
# hashes files of the workspace. Only the go-cache job saves the cache, on a push
# to main. The key holds the OS, the architecture and a hash of go.mod, go.sum,
# the tool versions, this file and the action. When no entry matches the key, a
# job restores the newest entry of the same runner. The go-cache job never does
# that, so a new entry starts clean and does not keep old module versions.
# The cache has one entry for each runner OS. The Linux entry holds the variants
# and the shared tools. The macOS and Windows entries hold the no-cgo build and
# the plain test compile. The jobs capabilities, workflows and secrets skip the
# restore (restore: 'false'), because they compile no iq package and the restore
# costs more than the tool compile that it saves.
# The jobs osv, sbom and secrets compile their tool themselves. Those tools bring
# about 3.9 GB of modules and 1.3 GB of build cache, which every Linux job would
# download if the cache held them.
#
# Integration tests and gates that need a datastore run ONE CONTAINER AT A TIME:
# GOFLAGS=-p=1 serialises package test binaries, so each driver's testcontainer
# comes up and goes down in turn (the stack is flaky under contention), and the
# e2e live flows bring up a single compose service each.
name: CI

# pull_request drives the per-change gates. The `changes` job decides whether the
# change touches code. If it does not (for example docs or another workflow only),
# the Go jobs are skipped: a job that its `if:` skips passes a required check.
# Never use paths-ignore for this, because then the required checks never report and
# the pull request cannot merge. The ruleset of main requires a pull request for each
# change, so each pushed tree was tested as a pull request. A push to main therefore
# runs only the coverage jobs, which keep the Codecov baseline of main, and the
# go-cache job, which saves the Go cache. The weekly schedule and
# manual dispatch drive the `deep-*` jobs (fresh CVE data, the sharded mutation
# scan of the packages that changed, the badge), gated off the fast jobs so a
# schedule run does not re-lint.
on:
  push:
    branches: [main] # a pull request branch runs through pull_request only, not twice
  pull_request:
    # ready_for_review starts the full run when a draft pull request is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      full:
        description: Scan every package, also the packages whose stored result is current
        type: boolean
        default: false
      packages:
        description: Plan only these packages (space-separated, for example ./internal/numfmt); empty plans all
        type: string
        default: ''

permissions:
  contents: read

# The weekly scan reads and force-pushes the `badges` branch, so two scans of one ref must
# not overlap: scheduled runs and manual dispatches of the same ref share one group and
# queue (a running scan is never cancelled; GitHub keeps at most one run waiting in a group
# and cancels an older waiting run). The ref is in the key, so a dispatch on a branch never
# replaces a waiting scan of main. The runs of one pull request share a group, and a new
# push cancels the run of the previous one, whose result nobody reads. A push to main
# gets a group of its own, so it never waits and is never cancelled.
concurrency:
  group: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('deep-mutation-scan-{0}', github.ref) || github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each Linux job starts with Harden-Runner in block mode. The allowed-endpoints list
# of a job holds every host that the job calls, and DEVELOPMENT.md explains how to
# add one. A matrix job (the coverage groups and the mutation shards) has one list
# that is the union for all legs.
# The Harden-Runner steps that are the same in several jobs, and the plain checkout
# step, share one YAML anchor. The first job in the file that uses a step defines
# the anchor, and each later job uses the alias (`- *name`). An alias is not a
# merge key, so GitHub accepts it. The anchor holds the pinned SHA, so a version
# update changes one line. A job that needs a host that the shared list does not
# have gets an inline step of its own. Never widen a shared list for one job. A
# checkout with fetch-depth or a zizmor ignore also stays inline.
jobs:
  # The one required check of the main ruleset. GitHub reports a skipped matrix job
  # under its bare name (`test`, not `test (ubuntu-latest)`), so the per-job checks
  # cannot be required when the changes job skips them. This job needs every
  # per-change job, runs also when one of them fails, and fails when one of them
  # failed or was cancelled. A skipped job passes. A new per-change job goes into
  # this needs list, and the ruleset does not change. It runs on pull requests only,
  # because a push to main has no required check. On a draft pull request the
  # slow jobs are skipped, so this job fails there: only the full run that starts
  # when the pull request is marked ready can pass it. It fails and does not skip
  # on purpose. GitHub counts a skipped job as a pass for a required check, and
  # the ready run creates its ci-ok check only after the jobs it needs end, so a
  # skipped draft ci-ok would let the pull request merge before the tests finish.
  ci-ok:
    if: always() && github.event_name == 'pull_request'
    needs: [changes, go-cache, lint, workflows, test, coverage-group, coverage, e2e, release-snapshot, vuln, osv, sbom, deadcode, secrets, capabilities, mutate-diff, fuzz, dco, demo-check, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - &harden-base
        name: Harden the runner (block egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.github.com:443
            github.com:443
      - name: Every per-change job passed or was skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          DRAFT: ${{ needs.changes.outputs.draft }}
        run: |
          echo "results: $RESULTS"
          if [ "$DRAFT" = true ]; then
            echo "::error::a draft pull request runs the fast jobs only; mark it ready for review to run everything"
            exit 1
          fi
          if [ "$CHANGES" != success ]; then
            echo "::error::the changes job did not pass: $CHANGES"
            exit 1
          fi
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) echo "::error::a per-change job ended as $r"; exit 1 ;;
            esac
          done

  # Sets code=false only when every changed file is on the list of files that no Go
  # job reads. Any other file, an unknown base, or an error sets code=true, so an
  # unexpected case runs everything. If it fails, the jobs that need it are
  # skipped, and ci-ok fails, which blocks the merge. The diff step writes the raw
  # results. The job outputs code, full, snapshot and docs are true only on a
  # pull request, so a push to main skips the jobs that a pull request already ran.
  # The output coverage reads the raw results, so a push with code changes keeps the
  # coverage jobs. The step sets cache=true on a push and on a pull request that
  # changes this file or the shared actions, so that the go-cache job builds with
  # the new files. It sets docs=true when a changed file is under docs/ or is this
  # file, so that the docs job builds the site only then. It also sets full=true
  # when code=true and the pull request is not a draft: the slow jobs (the test
  # matrix, e2e, the release snapshot, capabilities, fuzzing and the mutation gate)
  # run only then, so review rounds on a draft do not start them on every push. The
  # coverage output is the same without the pull request condition, and a draft
  # does not run the coverage jobs either. The output sbom is true when snapshot is
  # true or the Makefile changed, because the Makefile target sbom holds the syft
  # options. The sbom job does not read full.
  changes:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # read the live draft state of the pull request
    outputs:
      cache: ${{ steps.diff.outputs.cache }}
      code: ${{ github.event_name == 'pull_request' && steps.diff.outputs.code == 'true' }}
      coverage: ${{ steps.diff.outputs.code == 'true' && steps.draft.outputs.draft != 'true' }}
      docs: ${{ github.event_name == 'pull_request' && steps.diff.outputs.docs == 'true' }}
      draft: ${{ steps.draft.outputs.draft }}
      full: ${{ github.event_name == 'pull_request' && steps.diff.outputs.code == 'true' && steps.draft.outputs.draft != 'true' }}
      sbom: ${{ github.event_name == 'pull_request' && (steps.diff.outputs.release == 'true' || steps.diff.outputs.makefile == 'true') && steps.draft.outputs.draft != 'true' }}
      snapshot: ${{ github.event_name == 'pull_request' && steps.diff.outputs.release == 'true' && steps.draft.outputs.draft != 'true' }}
    steps:
      - *harden-base
      # The draft flag in the event payload is fixed when the event fires. When a
      # push and "ready for review" come close together, the run of the push can
      # cancel the ready run and still see draft=true, so it skips the slow jobs.
      # Read the live state instead. If the API call fails, use the payload.
      - id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          PAYLOAD_DRAFT: ${{ github.event.pull_request.draft == true }}
        run: |
          draft=false
          if [ -n "$NUMBER" ]; then
            if live="$(gh api "repos/$REPO/pulls/$NUMBER" --jq .draft)"; then
              draft=$live
            else
              echo "::warning::cannot read the draft state of pull request $NUMBER, so the event payload decides"
              draft=$PAYLOAD_DRAFT
            fi
          fi
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "changes: draft=$draft"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          release=true
          cache=true
          docs=true
          makefile=true
          if files="$(git diff --name-only "$BASE...$HEAD")"; then
            code=false
            release=false
            docs=false
            makefile=false
            # A push always builds the cache. A pull request builds it only when
            # the change can alter the cache key or the build steps.
            if [ "$EVENT" != push ]; then cache=false; fi
            while IFS= read -r f; do
              # The files that can alter the build or the packaging of the
              # release. The release also copies LICENSE, README.md, the man
              # page and the completions by fixed names, so only a deletion or a
              # rename of one of them can break it. The loop below finds those.
              case "$f" in
                .goreleaser.yaml | go.mod | go.sum | scripts/third-party-licenses.sh) release=true ;;
                scripts/tool-versions.env | .github/workflows/ci.yml | .github/actions/*) release=true ;;
              esac
              case "$f" in
                .github/workflows/ci.yml | .github/actions/*) cache=true ;;
              esac
              # The docs job builds the site, so it reads docs/ and, for the
              # workflow steps that build it, this file.
              case "$f" in
                docs/* | .github/workflows/ci.yml) docs=true ;;
              esac
              # The Makefile target sbom holds the syft options, and the sbom
              # job runs it. goreleaser does not read the Makefile.
              case "$f" in
                Makefile) makefile=true ;;
              esac
              case "$f" in
                '') ;;
                .github/workflows/ci.yml | .github/actions/*) code=true ;;
                docs/man/* | docs/completions/*) code=true ;; # drift tests read them
                skills/*) code=true ;; # cmd/skill_test.go reads SKILL.md
                *.md | docs/* | .github/* | .agents/* | LICENSE | .coderabbit.yaml | renovate.json | socket.yml | osv-scanner.toml) ;;
                *) code=true ;;
              esac
            done <<<"$files"
            # With --no-renames, a rename shows as a deletion of the old path.
            if deleted="$(git diff --name-only --no-renames --diff-filter=D "$BASE...$HEAD")"; then
              while IFS= read -r f; do
                case "$f" in
                  LICENSE | README.md | docs/man/* | docs/completions/*) release=true ;;
                esac
              done <<<"$deleted"
            else
              echo "::warning::cannot list the deleted files of $BASE...$HEAD, so the release snapshot runs"
              release=true
            fi
          else
            echo "::warning::cannot diff $BASE...$HEAD, so every job runs"
          fi
          {
            echo "cache=$cache"
            echo "code=$code"
            echo "docs=$docs"
            echo "makefile=$makefile"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "changes: code=$code release=$release cache=$cache docs=$docs makefile=$makefile"
          printf '%s\n' "$files"

  # Builds the Go cache that the other jobs restore (see the comment at the top of
  # this file). On a push to main it saves one entry for each runner, unless the
  # exact key exists. On a pull request it builds and saves nothing, so a mistake
  # in a build step fails the pull request and not main. A draft skips it, so the
  # review rounds do not start three cold builds. It never restores the fallback
  # entry, because that entry carries every old module version into the new one,
  # and Go never trims the module cache. The Linux leg compiles every variant that
  # the Linux jobs build and the tools that more than one job runs, and runs none
  # of them: a tool can call the network when it starts, and the host list of this
  # job blocks that. It does not compile syft, osv-scanner and gitleaks. The jobs
  # sbom, osv and secrets compile them, because they bring about 3.9 GB of modules
  # and 1.3 GB of build cache.
  go-cache:
    needs: changes
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      needs.changes.outputs.cache == 'true' && needs.changes.outputs.draft != 'true')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - &harden-go-linux
        name: Harden the runner (block egress)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.github.com:443
            dl.google.com:443
            github.com:443
            go.dev:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: $/.github/actions/setup-go
        with:
          lookup-only: 'true'
      # A pull request always builds, so that it tests the build steps. A push builds
      # only when the exact entry does not exist.
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          CACHE_HIT: ${{ steps.go.outputs.cache-hit }}
        run: |
          build=false
          if [ "$EVENT" = pull_request ] || [ "$CACHE_HIT" != true ]; then build=true; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "go-cache: build=$build cache-hit=$CACHE_HIT"
      - name: Download the modules
        if: steps.plan.outputs.build == 'true' && runner.os == 'Linux'
        run: go mod download
      - name: Build
        if: steps.plan.outputs.build == 'true' && runner.os == 'Linux'
        run: go build ./...
      - name: Build without cgo, with trimpath
        if: steps.plan.outputs.build == 'true' && runner.os == 'Linux'
        run: CGO_ENABLED=0 go build -trimpath ./...
      # go test -c -o <dir>/ fails when two packages have the same last path
      # element. No package has one now. The three variants match the test job
      # (-race), the coverage groups (-covermode and -coverpkg) and a plain run.
      - name: Compile the test binaries (plain, race, cover)
        if: steps.plan.outputs.build == 'true' && runner.os == 'Linux'
        run: |
          go test -c -o "$RUNNER_TEMP/plain/" ./...
          go test -race -c -o "$RUNNER_TEMP/race/" ./...
          go test -covermode=atomic -coverpkg=./... -c -o "$RUNNER_TEMP/cover/" ./...
      # A crasher in the seed corpus fails this job. Then the job saves nothing, and
      # the fuzz job of the next pull request reports the same crasher.
      - name: Compile the fuzz targets
        if: steps.plan.outputs.build == 'true' && runner.os == 'Linux'
        env:
          IQ_FUZZ_TIME: 1x
        run: bash scripts/fuzz.sh
      # go install compiles each tool and does not run it. A version command can
      # call the network. For example govulncheck -version contacts vuln.go.dev,
      # and the host list of this job blocks that host. A later go run takes the
      # compiled packages from the cache and only links the tool again.
      - name: Compile the pinned tools
        if: steps.plan.outputs.build == 'true' && runner.os == 'Linux'
        run: |
          . scripts/tool-versions.env
          export GOBIN="$RUNNER_TEMP/bin"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION"
          go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          go install "golang.org/x/tools/cmd/deadcode@$DEADCODE_VERSION"
          go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
      - name: Build and compile the tests (no cgo)
        if: steps.plan.outputs.build == 'true' && runner.os != 'Linux'
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          go mod download
          go build -trimpath ./...
          go test -c -o "$RUNNER_TEMP/plain/" ./...
      - name: Save the Go cache
        if: github.event_name == 'push' && steps.go.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.gocache }}
            ${{ steps.go.outputs.gomodcache }}
          key: ${{ steps.go.outputs.key }}

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - &harden-go
        name: Harden the runner (block egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.github.com:443
            dl.google.com:443
            github.com:443
            go.dev:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
      - *checkout
      - uses: $/.github/actions/setup-go
      # go install through the module proxy, verified by the checksum database,
      # like every other tool here; the upstream curl|sh installer verifies the
      # release tarball against a checksums file and has failed on a mismatch.
      - name: Install golangci-lint
        run: |
          . scripts/tool-versions.env
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # .golangci.yml enables the gofumpt + goimports formatters, so `fmt` is the
      # same canonical pass as `gofumpt -w . && goimports -w .` locally.
      - name: Formatting (gofumpt + goimports)
        run: |
          golangci-lint fmt
          git diff --exit-code || { echo "::error::run 'gofumpt -w . && goimports -w .' and commit the result"; exit 1; }
      # golangci-lint runs the vet analyzers, and `make check` keeps `go vet` for
      # local runs. This step builds the packages without cgo and with trimpath, as
      # the release does. A pull request builds linux/amd64 here, darwin/arm64 in
      # the macOS leg of test and windows/amd64 in the Windows leg of test. It does
      # not build linux/arm64, darwin/amd64 or windows/arm64. That gap is accepted.
      # The release-snapshot job builds all six targets when a release input changes.
      - name: Build without cgo, with trimpath
        run: CGO_ENABLED=0 go build -trimpath ./...
      - name: Lint
        run: golangci-lint run
      # go install refuses a module whose go.mod has a replace or exclude directive.
      # The builds of this workflow use the checkout and accept such a directive.
      # This step and its fixture tests also run in `make check`.
      - name: go install accepts the module
        run: |
          bash scripts/go-installable.sh
          bash scripts/test/go-installable.sh

  # zizmor audits the workflow files themselves. It reports unpinned or impostor
  # actions, persisted credentials, cache poisoning on release paths, and template
  # injection. `make security` runs the same uvx invocation locally, so the gate is
  # one command in both places. The marketplace action is not used, because it adds
  # a mirrored action for no gain. An accepted finding gets an inline
  # `# zizmor: ignore[<audit>]` comment with a reason.
  # actionlint checks correctness: the workflow schema, the types in `${{ }}`
  # expressions, `needs` and `outputs` references, action inputs, and the `run`
  # blocks through shellcheck. An accepted shellcheck finding gets an inline
  # `# shellcheck disable=` line with a reason. A finding with no inline form goes
  # into .github/actionlint.yaml.
  workflows:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (block egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.github.com:443
            dl.google.com:443
            files.pythonhosted.org:443
            github.com:443
            go.dev:443
            proxy.golang.org:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443
            storage.googleapis.com:443
            sum.golang.org:443
      - *checkout
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # GH_TOKEN adds the online audits: known-vulnerable-actions, impostor-commit,
      # ref-confusion and stale-action-refs. zizmor exits 11 to 14 on a finding.
      - name: zizmor (GitHub Actions workflow audit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . scripts/tool-versions.env
          uvx "zizmor==$ZIZMOR_VERSION" .github/
      # The restore is off. The go-cache job warms actionlint, but the compile takes
      # about 16 s and the restore takes about 60 s.
      - uses: $/.github/actions/setup-go
        with:
          restore: 'false'
      # The runner has shellcheck, so actionlint also checks the run blocks.
      - name: actionlint (GitHub Actions workflow lint)
        run: |
          . scripts/tool-versions.env
          go run "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"

  # -short is the dependency-free path: container-backed driver suites skip. The
  # committed man page and completions are drift-guarded by tests in this run.
  # The Linux leg runs with the race detector. The macOS and Windows legs do not:
  # -race needs cgo and a C toolchain there.
  test:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # cgo is on for the race detector on Linux and off on the other runners.
    env:
      CGO_ENABLED: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    steps:
      - *harden-go-linux
      - *checkout
      - uses: $/.github/actions/setup-go
      # The go-cache job builds with -trimpath on macOS and Windows. This step makes
      # these legs build the same way, so that they use the cached objects. It is
      # also the only per-change build of those targets, because the cross job is
      # gone.
      - name: Build (-trimpath)
        if: runner.os != 'Linux'
        shell: bash
        run: go build -trimpath ./...
      - name: Test (-short, shuffled, -race on Linux)
        env:
          RACE: ${{ matrix.os == 'ubuntu-latest' && '-race' || '' }}
        run: |
          # shellcheck disable=SC2086 # RACE is empty off Linux and must disappear from the command.
          go test -short -shuffle=on $RACE ./...

  # Full suite with -coverpkg=./... and the IQ_COVER_MIN floor, split across
  # runners. Each coverage-group job tests a set of packages on its own runner
  # and uploads a partial profile (IQ_COVER_PKGS in scripts/coverage.sh). The
  # coverage job joins the partial profiles and applies the floor
  # (IQ_COVER_MERGE). Locally, make cover still runs the whole suite on one
  # machine. No IQ_*_URL is set except HBase's, so every other driver's
  # TestMain provisions its own testcontainer, and -p=1 keeps that to one
  # container at a time per runner. HBase has no testcontainers path (native
  # RPC needs the region server's advertised hostname), so its group starts the
  # compose service with host networking. The "rest" group tests every package
  # that no other group names, so a new package is always in one group.
  coverage-group:
    needs: changes
    if: needs.changes.outputs.coverage == 'true'
    name: coverage (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: couchbase
            packages: ./drivers/couchbase
          - group: elasticsearch
            packages: ./drivers/elasticsearch
          - group: cassandra-neo4j-hbase
            packages: ./drivers/cassandra ./drivers/neo4j ./drivers/hbase
            hbase: true
          - group: rest
            # Keep this list equal to the packages of the groups above.
            exclude: drivers/(couchbase|elasticsearch|cassandra|neo4j|hbase)
    steps:
      - &harden-docker-elastic
        name: Harden the runner (block egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            *.r2.cloudflarestorage.com:443
            api.github.com:443
            auth.docker.io:443
            dl.google.com:443
            docker-auth.elastic.co:443
            docker.elastic.co:443
            github.com:443
            go.dev:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            proxy.golang.org:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
      - *checkout
      - uses: $/.github/actions/setup-go
      - name: Start HBase (compose, host networking)
        if: matrix.hbase
        run: docker compose up -d --wait hbase
      - name: Test with coverage (one container at a time)
        env:
          GOFLAGS: -p=1
          IQ_HBASE_URL: ${{ matrix.hbase && 'hbase://localhost:2181/' || '' }}
          PACKAGES: ${{ matrix.packages }}
          EXCLUDE: ${{ matrix.exclude }}
        run: |
          if [ -n "$EXCLUDE" ]; then
            PACKAGES="$(go list ./... | grep -vE "^github.com/zsltg/iq/($EXCLUDE)\$" | tr '\n' ' ')"
          fi
          mkdir -p partial
          read -ra pkgs <<<"$PACKAGES"
          go list "${pkgs[@]}" > partial/packages.txt
          IQ_COVER_PKGS="$PACKAGES" bash scripts/coverage.sh
          mv coverage.out partial/coverage.out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.group }}
          path: partial
          if-no-files-found: error
          retention-days: 7

  # The required check. It runs also when a group fails, and then fails too, so
  # a failed group can never show as a skipped (passing) coverage check. When the
  # change touches no code, or the pull request is a draft, it is skipped with the
  # groups, which passes the check. It also runs on a push to main with code changes.
  coverage:
    if: always() && needs.changes.outputs.coverage == 'true'
    needs: [changes, coverage-group]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (block egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.github.com:443
            cli.codecov.io:443
            dl.google.com:443
            github.com:443
            go.dev:443
            ingest.codecov.io:443
            keybase.io:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
      - name: All groups passed
        env:
          RESULT: ${{ needs.coverage-group.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::a coverage group did not pass: $RESULT"
            exit 1
          fi
      - *checkout
      - uses: $/.github/actions/setup-go
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: partial
      - name: Each package is in exactly one group
        run: |
          cat partial/*/packages.txt | sort > tested.txt
          go list ./... | sort > all.txt
          if ! diff all.txt tested.txt; then
            echo "::error::the coverage groups do not test each package exactly once"
            exit 1
          fi
      - name: Join the partial profiles + floor
        run: IQ_COVER_MERGE="$(echo partial/*/coverage.out)" bash scripts/coverage.sh
      # Reporting only, the floor above is the gate. Guarded to the GitHub mirror:
      # marketplace actions beyond checkout/setup-go are not mirrored elsewhere.
      - name: Upload coverage to Codecov
        if: startsWith(github.server_url, 'https://github.com')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Black-box run of the built binary (package e2e). The two live flows need a
  # backend each and skip when its IQ_*_URL is unset, so they run in two passes with
  # a single compose service up at a time.
  e2e:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - &harden-docker
        name: Harden the runner (block egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            *.r2.cloudflarestorage.com:443
            api.github.com:443
            auth.docker.io:443
            dl.google.com:443
            github.com:443
            go.dev:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            proxy.golang.org:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
      - *checkout
      - uses: $/.github/actions/setup-go
      - name: e2e with redis (all cases + the redis live flow)
        run: |
          docker compose up -d --wait redis
          IQ_REDIS_URL=redis://localhost:6379/0 go test ./e2e/
          docker compose stop redis
      - name: e2e mongo live flow
        run: |
          docker compose up -d --wait mongo
          IQ_MONGO_URL=mongodb://localhost:27017/iq_test go test ./e2e/ -run TestLiveMongoRoundTrip
          docker compose stop mongo

  # Builds the release as a snapshot, with no publish and no signature, so that a
  # broken .goreleaser.yaml fails a pull request and not the release. Then checks
  # that each archive and the .deb package carry the same files as the
  # third-party-licenses/ tree that the before hook wrote. The source archive
  # (iq-<version>.tar.gz) is a git archive, so the check skips it. The job takes
  # about 11 minutes, so it runs only when a file changes that can alter the build
  # or the packaging (snapshot=true from the changes job). A code change alters
  # only which license texts go in the tree, and the osv job checks those on
  # every change.
  release-snapshot:
    needs: changes
    if: needs.changes.outputs.snapshot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *harden-go
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # goreleaser reads the tags to set the snapshot version
      - uses: $/.github/actions/setup-go
      - name: Release snapshot
        run: |
          . scripts/tool-versions.env
          go run github.com/goreleaser/goreleaser/v2@"$GORELEASER_VERSION" \
            release --snapshot --clean --skip=publish,sign
      - name: Each archive and package carries the license texts
        run: |
          want="$(find third-party-licenses -type f | LC_ALL=C sort)"
          [ -n "$want" ] || { echo "::error::the before hook wrote no license file"; exit 1; }
          # $2 is the list of license paths in the artifact $1, in any order.
          check() {
            got="$(printf '%s\n' "$2" | LC_ALL=C sort)"
            if [ "$got" != "$want" ]; then
              echo "::error::$1 does not carry the same files as third-party-licenses/"
              diff <(printf '%s\n' "$want") <(printf '%s\n' "$got") || true
              fail=1
            fi
            echo "$1: $(printf '%s\n' "$got" | grep -c .) files"
          }
          fail=0
          for f in dist/iq_*.tar.gz; do
            check "$f" "$(tar -tzf "$f" | grep '^third-party-licenses/.*[^/]$')"
          done
          for f in dist/iq_*.zip; do
            check "$f" "$(unzip -Z1 "$f" | grep '^third-party-licenses/.*[^/]$')"
          done
          prefix='./usr/share/licenses/iq/third-party/'
          for f in dist/iq_*.deb; do
            check "$f" "$(dpkg-deb -c "$f" | awk -v p="$prefix" \
              '$1 ~ /^-/ && index($6, p) == 1 { print "third-party-licenses/" substr($6, length(p) + 1) }')"
            # Every user must be able to open each directory of the tree.
            bad="$(dpkg-deb -c "$f" | awk -v p="$prefix" '$1 ~ /^d/ && index($6, p) == 1 && $1 != "drwxr-xr-x"')"
            if [ -n "$bad" ]; then
              echo "::error::$f has a license directory that is not mode 0755"
              printf '%s\n' "$bad"
              fail=1
            fi
          done
          exit "$fail"

  vuln:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (block egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.github.com:443
            dl.google.com:443
            github.com:443
            go.dev:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            vuln.go.dev:443
      - *checkout
      - uses: $/.github/actions/setup-go
      - name: govulncheck
        run: |
          . scripts/tool-versions.env
          go run golang.org/x/vuln/cmd/govulncheck@"$GOVULNCHECK_VERSION" ./...

  # OSV complements govulncheck: the whole dependency graph regardless of symbol
  # reachability, and --licenses gates every dependency against the allowlist.
  osv:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (block egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.deps.dev:443
            api.github.com:443
            api.osv.dev:443
            dl.google.com:443
            github.com:443
            go.dev:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
      - *checkout
      - uses: $/.github/actions/setup-go
      - name: OSV scan + license allowlist
        # The allowlist is scripts/license-allowlist.txt, which make security reads too.
        run: |
          . scripts/tool-versions.env
          allow="$(grep -Ev '^(#|$)' scripts/license-allowlist.txt | paste -sd, -)"
          # An empty list turns --licenses into a summary with no verdict, so stop.
          [ -n "$allow" ] || { echo "::error::scripts/license-allowlist.txt lists no license"; exit 1; }
          go run github.com/google/osv-scanner/v2/cmd/osv-scanner@"$OSV_SCANNER_VERSION" \
            scan source --licenses="$allow" -L go.mod
      - name: Third-party license texts
        # The release ships these texts. A module without a license file fails here,
        # on every change, also when the release-snapshot job does not run.
        run: bash scripts/third-party-licenses.sh

  # Generation-only: proves the SBOMs build. The job runs `make sbom`, the one place
  # that holds the syft options. It uploads no artifact, because the release builds
  # its own SBOM. The SBOM lists the Go module graph only. A release input changes
  # that graph, and a Makefile change can break the recipe, so the job runs when
  # the output sbom is true.
  sbom:
    needs: changes
    if: needs.changes.outputs.sbom == 'true'
    runs-on: ubuntu-latest
    steps:
      - *harden-go
      - *checkout
      - uses: $/.github/actions/setup-go
      - name: Generate SBOMs (syft, SPDX + CycloneDX)
        run: make sbom

  # Whole-program dead code: a function reachable from neither main nor any test.
  deadcode:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - *harden-go
      - *checkout
      - uses: $/.github/actions/setup-go
      - name: Dead code (whole program)
        run: |
          . scripts/tool-versions.env
          out="$(go run golang.org/x/tools/cmd/deadcode@"$DEADCODE_VERSION" -test ./...)"
          if [ -n "$out" ]; then echo "$out"; echo "::error::dead code: delete it or wire it up"; exit 1; fi

  # Developer Certificate of Origin: every new commit of a pull request carries a
  # Signed-off-by trailer for its author (scripts/dco.sh). A second step makes sure
  # that no commit message holds an address that scripts/commit-emails.sh does not
  # allow. It runs for every pull request, also one without code; on a push to
  # main it is skipped, because the commits there already passed it as a pull request.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - *harden-base
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/dco.sh "$BASE" "$HEAD"
      - name: Check the addresses in the commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/commit-emails.sh "$BASE..$HEAD"

  secrets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - *harden-go
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the range scan needs the commits of the pull request
      # The restore is off. The go-cache job does not warm gitleaks, so the restore
      # would only download modules that this job does not use.
      - uses: $/.github/actions/setup-go
        with:
          restore: 'false'
      # The history scan covers only the commits of the pull request. The weekly
      # deep-scan job keeps the only scan of the full history.
      - name: gitleaks (working tree + pull request commits)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          . scripts/tool-versions.env
          go run github.com/zricethezav/gitleaks/v8@"$GITLEAKS_VERSION" dir --no-banner .
          go run github.com/zricethezav/gitleaks/v8@"$GITLEAKS_VERSION" git --no-banner --log-opts="$BASE..$HEAD" .

  # What the dependency tree can *do* (google/capslock, scripts/capabilities.sh).
  # The wrapper self-skips unless go.mod or go.sum moved against the base, so this
  # is usually a few seconds; a real run peaks around 7 GB RSS.
  capabilities:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - *harden-go
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] the step below fetches the PR base
        with:
          fetch-depth: 0 # the merge-base with the trunk must be reachable
      # The restore is off. The wrapper skips itself unless go.mod or go.sum changed.
      # When it runs, it compiles many packages. That case is rare.
      - uses: $/.github/actions/setup-go
        with:
          restore: 'false'
      - name: Capability drift vs capslock-baseline.json
        env:
          BASE: ${{ github.base_ref || 'main' }} # PR target branch, else the trunk
        run: |
          git fetch --no-tags origin "$BASE"
          IQ_CAPS_BASE="origin/$BASE" bash scripts/capabilities.sh

  # Mutation feedback scoped to the change (scripts/mutation-gate.sh): mutates only
  # lines changed vs the trunk and enumerates only the packages holding them.
  # BLOCKING: an escaped mutant on a changed covered line, or an errored/timed-out
  # mutant, fails the job; a genuine equivalent goes into mutago-baseline.json with
  # a note. Driver packages provision their testcontainer per test run, so with
  # --workers 1 and -p=1 there is one container at a time. The one exception is
  # drivers/hbase: its tests run only against the compose service, so the HBase
  # step below starts it when the change touches that driver. The `deep-*` jobs scan
  # the changed packages weekly (all packages monthly), one shard per runner.
  mutate-diff:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - *harden-docker
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] the step below fetches the PR base
        with:
          fetch-depth: 0 # full history so the diff base is reachable
      - uses: $/.github/actions/setup-go
      # The HBase tests have no testcontainer. They run only against the compose
      # service and skip without it. Without this step, a change to drivers/hbase
      # would pass the gate with those lines untested, as "not covered".
      - name: Start HBase when drivers/hbase changed (compose)
        env:
          BASE: ${{ github.base_ref || 'main' }} # PR target branch, else the trunk
        run: |
          git fetch --no-tags origin "$BASE"
          if git diff --quiet "$(git merge-base "origin/$BASE" HEAD)" -- drivers/hbase; then
            echo "drivers/hbase is unchanged, so the gate needs no HBase server"
          else
            docker compose up -d --wait hbase
            echo "IQ_HBASE_URL=hbase://localhost:2181/" >> "$GITHUB_ENV"
          fi
      - name: Mutation testing (scoped to the change, one container at a time)
        env:
          BASE: ${{ github.base_ref || 'main' }} # PR target branch, else the trunk
          GOFLAGS: -p=1
        run: |
          IQ_MUTATION_BASE="origin/$BASE" bash scripts/mutation-gate.sh
      # The ids of the escapes, for the baseline of an accepted equivalent, without a
      # local re-run. The candidate file exists only when the gate failed on an escape.
      - name: Upload the mutation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutate-diff
          path: |
            report.json
            mutago-agentic.json
            mutago-baseline.candidate.json
          if-no-files-found: ignore
          retention-days: 14

  # Go native fuzzing over the parsers that read untrusted bytes (scripts/fuzz.sh),
  # one target per invocation because that is what `go test -fuzz` takes. The budget
  # here is the default 20s per target, enough to re-cover the committed corpus and
  # explore a little; deep-fuzz gives each target 5m on the weekly run. A crasher
  # fails the job, and the fix commits the input Go wrote as the regression seed.
  fuzz:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - *harden-go
      - *checkout
      - uses: $/.github/actions/setup-go
      - name: Fuzz the untrusted parsers
        run: bash scripts/fuzz.sh

  # Eight targets at 5m each, plus the build, fits well inside the hour. The corpus
  # grows on a cadence rather than on a pull request.
  deep-fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - *harden-go
      - *checkout
      - uses: $/.github/actions/setup-go
      - name: Fuzz the untrusted parsers (long budget)
        env:
          IQ_FUZZ_TIME: 5m
        run: bash scripts/fuzz.sh

  # Weekly + manual deep scan, gated to schedule/workflow_dispatch:
  # deep-scan re-runs the vulnerability scanners against fresh OSV/CVE data on
  # unchanged code and the secret history. The mutation scan is incremental and
  # sharded (scripts/mutation-plan.sh has the details). deep-plan reads the stored
  # state from the `badges` branch, finds the packages whose fingerprint changed,
  # and cuts each into shards of (file, mutator) cells of about 120 min at most.
  # deep-mutate runs ONE shard per runner, with its own containers on its own
  # machine, so the rule of one container at a time still holds per runner.
  # deep-badge merges the shards of each package, gives the verdict, and on main
  # publishes the new state and the badge. The first seven days of each month
  # scan every package, which catches effects across packages that a fingerprint
  # of one package cannot see. Parallelism is across runners, never inside one: a
  # driver package boots a JVM-sized container per test run and a 16 GB runner
  # cannot hold two of them without the timeouts the gate treats as failures.
  deep-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (block egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.deps.dev:443
            api.github.com:443
            api.osv.dev:443
            dl.google.com:443
            files.pythonhosted.org:443
            github.com:443
            go.dev:443
            proxy.golang.org:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443
            storage.googleapis.com:443
            sum.golang.org:443
            vuln.go.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks history
      - uses: $/.github/actions/setup-go
      - name: Vulnerabilities (govulncheck + OSV, fresh data)
        run: |
          . scripts/tool-versions.env
          go run golang.org/x/vuln/cmd/govulncheck@"$GOVULNCHECK_VERSION" ./...
          allow="$(grep -Ev '^(#|$)' scripts/license-allowlist.txt | paste -sd, -)"
          # An empty list turns --licenses into a summary with no verdict, so stop.
          [ -n "$allow" ] || { echo "::error::scripts/license-allowlist.txt lists no license"; exit 1; }
          go run github.com/google/osv-scanner/v2/cmd/osv-scanner@"$OSV_SCANNER_VERSION" \
            scan source --licenses="$allow" -L go.mod
      - name: Secret history scan
        run: |
          . scripts/tool-versions.env
          go run github.com/zricethezav/gitleaks/v8@"$GITLEAKS_VERSION" git --no-banner .
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The online audits read the advisory data of GitHub, so a re-run on
      # unchanged workflows finds a newly vulnerable or yanked action.
      - name: zizmor (GitHub Actions workflow audit, fresh data)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . scripts/tool-versions.env
          uvx "zizmor==$ZIZMOR_VERSION" .github/

  deep-plan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - *harden-go
      - *checkout
      - uses: $/.github/actions/setup-go
      # Read-only: the token goes to git as a header in the environment, never in a
      # URI or an argument. A branch that does not exist yet gives an empty state.
      - name: Fetch the stored state (badges branch)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/mutation-state.sh fetch badges
      # Every package with a non-test Go file is the module list for the verdict;
      # an empty list stops here, so a `go list` error cannot remove all state.
      # The `packages` input limits the plan, not that list. Full mode comes from
      # the `full` input or from the first seven days of the month. The plan
      # script cleans and examines each requested package. The full plan (with the
      # cell lists) goes to the scan-plan artifact, because it is too large for an
      # environment variable; the job output keeps only what the matrix needs.
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_FULL: ${{ inputs.full }}
          INPUT_PACKAGES: ${{ inputs.packages }}
        run: |
          mkdir -p plan
          go list -f '{{if .GoFiles}}{{.ImportPath}}{{end}}' ./... \
            | sed "s|^$(go list -m)|.|" > plan/packages.txt
          if [ ! -s plan/packages.txt ]; then
            echo "::error::go list found no package; the plan stops"
            exit 1
          fi
          full=""
          if [ "$INPUT_FULL" = "true" ]; then full=1; fi
          if [ "$EVENT" = "schedule" ] && [ "$(date -u +%-d)" -le 7 ]; then full=1; fi
          read -r -a requested <<< "$INPUT_PACKAGES"
          IQ_MUTATION_FULL="$full" bash scripts/mutation-plan.sh badges "${requested[@]}" > plan/plan.json
          matrix="$(jq -c 'map({package, slug, shard, shards})' plan/plan.json)"
          echo "plan: $(wc -c < plan/plan.json) bytes, matrix output: ${#matrix} bytes"
          if [ "${#matrix}" -gt 900000 ]; then
            echo "::error::the matrix output is ${#matrix} bytes, near the 1 MB limit of a job output"
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-plan
          path: plan
          if-no-files-found: error
          retention-days: 7

  deep-mutate:
    needs: deep-plan
    if: needs.deep-plan.outputs.matrix != '[]'
    name: mutate ${{ matrix.package }} ${{ matrix.shard }}/${{ matrix.shards }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false # every shard reports; one red shard does not hide the others
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.deep-plan.outputs.matrix) }}
    steps:
      - *harden-docker-elastic
      - *checkout
      - uses: $/.github/actions/setup-go
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scan-plan
          path: plan
      # Start the package's backing service(s) from compose ONCE and point the
      # IQ_*_URL override at them: with the env set, every per-mutant test run
      # reuses the running service instead of booting a fresh testcontainer,
      # which is what lets a driver package finish inside the job timeout (the
      # 8.17/2.17 JVM pairs cost ~a minute per boot). This mirrors the local
      # per-driver recipe; only this package's services run on this runner.
      # The package-to-service mapping lives in scripts/ci-backend.sh, which
      # the mutant-proof workflow shares.
      - name: Start the package's backend (compose)
        env:
          PKG: ${{ matrix.package }}
        run: bash scripts/ci-backend.sh "$PKG"
      # One gate run for each (file, mutator) cell of this shard, with no gate
      # flag. The runner reads its cells from the plan artifact. The verdict comes
      # from deep-badge, which merges all shards of the package. The runner installs
      # mutago once, with a bounded retry, and removes the value of each IQ_*_URL
      # from the logs before it prints or keeps them.
      # The step limit is below the job limit of 300 min. A step that times out
      # fails, and the upload that follows still has time to keep the finished cells.
      - name: Mutation testing (shard)
        timeout-minutes: 285
        env:
          GOFLAGS: -p=1
          PKG: ${{ matrix.package }}
          SHARD: ${{ matrix.shard }}
        run: bash scripts/mutation-shard.sh shard-out plan/plan.json "$PKG" "$SHARD"
      # shard.json and the cell reports feed deep-badge. mutago-agentic.json in
      # each cell carries each escaped mutant WITH its stable id, which is what
      # IQ_MUTATION_MUTANT takes, so hardening a package starts by downloading
      # these artifacts. They upload also when the shard fails, because a failed
      # shard is the one to harden. They also upload when the job times out or is
      # cancelled, so the finished cells of that shard are kept. Such a shard has
      # no shard.json (the runner writes it last), so the verdict fails its package.
      # overwrite lets "Re-run failed jobs" replace the artifact of the failed attempt.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-${{ matrix.slug }}-${{ matrix.shard }}
          path: shard-out
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The verdict. It runs when deep-mutate finished (success or failure) or was
  # skipped (nothing to scan, the stored state is reused), not when it was
  # cancelled. scripts/mutation-verdict.sh judges each package on its own: a
  # package with a missing, failed or timed-out shard fails and keeps its previous
  # state, and the packages that passed get new state. The job is red when any
  # package failed. A new mutation.json (the shields.io endpoint the README reads
  # via raw.githubusercontent.com) is written only when no package failed and each
  # package has current state. This job can only read; deep-publish pushes.
  deep-badge:
    needs: [deep-plan, deep-mutate]
    if: >-
      always() && needs.deep-plan.result == 'success' &&
      (needs.deep-mutate.result == 'success' || needs.deep-mutate.result == 'failure' ||
       needs.deep-mutate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.verdict.outputs.publish }}
    steps:
      - *harden-go
      - *checkout
      - uses: $/.github/actions/setup-go
      - name: Fetch the stored state (badges branch)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/mutation-state.sh fetch badges
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scan-plan
          path: plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.deep-mutate.result != 'skipped'
        with:
          pattern: mutation-*
          path: shards
      # Exit 0: every package passed. Exit 1: a package failed, and the state of
      # the others is written. Exit 2: the input cannot be used, nothing written.
      # With 0 or 1 the new state goes to deep-publish; the step still ends red
      # on 1.
      - id: verdict
        name: Verdict
        shell: bash
        run: |
          mkdir -p shards
          status=0
          bash scripts/mutation-verdict.sh shards badges plan/plan.json plan/packages.txt || status=$?
          if [ "$status" -eq 0 ] || [ "$status" -eq 1 ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.verdict.outputs.publish == 'true'
        with:
          name: scan-state
          path: badges
          if-no-files-found: error
          retention-days: 7

  # Push the new state and badge to the `badges` branch. Only this job can write,
  # and only on main on the GitHub mirror, so a manual run on a branch gives a
  # verdict and publishes nothing.
  deep-publish:
    needs: deep-badge
    if: >-
      always() && needs.deep-badge.outputs.publish == 'true' &&
      startsWith(github.server_url, 'https://github.com') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - *harden-base
      - *checkout
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scan-state
          path: badges
      - name: Publish the state and the badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/mutation-state.sh publish badges

  # The README GIF is a recording of iq's output, and nothing in a build tells you when
  # the code it shows has moved on. The stamp is the hash of the sources it was
  # recorded from, and re-hashing them needs git and sha256sum only, so this gate runs
  # here even though none of the recorder (expect, asciinema, agg, a patched Nerd Font)
  # is installed; recording stays manual, catching staleness does not.
  demo-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - *harden-base
      - *checkout
      - name: Demo stamp
        run: bash scripts/demo/stamp.sh check

  # Build the Zensical docs site on a pull request that changes docs/ or this file,
  # so that a broken page fails the PR. A change to this file can alter the build
  # steps. docs.yml owns the GitHub Pages deploy on pushes to main.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (block egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443
      - *checkout
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build site
        run: uv run --locked zensical build --clean
        working-directory: docs
