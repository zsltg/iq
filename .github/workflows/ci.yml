# GitHub Actions syntax. The primary remote is a self-hosted git server with Actions off,
# so this file runs only on the GitHub mirror (release.yml and docs.yml share that
# guard style). checkout and setup-go are universally mirrored, golangci-lint
# installs via `go install`, and every other tool runs via
# `go run <module>@<version>` or through the repo's own wrappers (which provision
# their pinned mutago/capslock into a throwaway GOBIN), so nothing touches go.mod.
# Keep the versions below in sync with the Makefile and scripts/.
#
# Integration tests and gates that need a datastore run ONE CONTAINER AT A TIME:
# GOFLAGS=-p=1 serialises package test binaries, so each driver's testcontainer
# comes up and goes down in turn (the stack is flaky under contention), and the
# e2e live flows bring up a single compose service each.
name: CI

# push / pull_request drive the fast per-change gates. The weekly schedule and
# manual dispatch drive the `deep-*` jobs (fresh CVE data, whole-repo mutation one
# package per runner, the badge), gated off the fast jobs so a schedule run does
# not re-lint.
on:
  push:
  pull_request:
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.13.1 # 2.12 and older bundle a staticcheck that panics on Go 1.27
  GOVULNCHECK_VERSION: v1.7.0
  GITLEAKS_VERSION: v8.30.1
  OSV_SCANNER_VERSION: v2.3.8
  DEADCODE_VERSION: v0.49.0 # golang.org/x/tools
  SYFT_VERSION: v1.45.1
  ZIZMOR_VERSION: 1.30.0 # PyPI, no v prefix
  # Permissive licenses the dependency tree is allowed to carry (AGENTS.md Tech Stack).
  # Unlicense is public domain (vbauerster/mpb, the progress bar).
  LICENSE_ALLOWLIST: Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MIT,MPL-2.0,Unlicense

jobs:
  lint:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # go install through the module proxy, verified by the checksum database,
      # like every other tool here; the upstream curl|sh installer verifies the
      # release tarball against a checksums file and has failed on a mismatch.
      - name: Install golangci-lint
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # .golangci.yml enables the gofumpt + goimports formatters, so `fmt` is the
      # same canonical pass as `gofumpt -w . && goimports -w .` locally.
      - name: Formatting (gofumpt + goimports)
        run: |
          golangci-lint fmt
          git diff --exit-code || { echo "::error::run 'gofumpt -w . && goimports -w .' and commit the result"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Lint
        run: golangci-lint run

  # zizmor audits the workflow files themselves. It reports unpinned or impostor
  # actions, persisted credentials, cache poisoning on release paths, and template
  # injection. `make security` runs the same uvx invocation locally, so the gate is
  # one command in both places. The marketplace action is not used, because it adds
  # a mirrored action for no gain. An accepted finding gets an inline
  # `# zizmor: ignore[<audit>]` comment with a reason.
  workflows:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # GH_TOKEN adds the online audits: known-vulnerable-actions, impostor-commit,
      # ref-confusion and stale-action-refs. zizmor exits 11 to 14 on a finding.
      - name: zizmor (GitHub Actions workflow audit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx "zizmor==$ZIZMOR_VERSION" .github/

  # -short is the dependency-free path: container-backed driver suites skip. The
  # committed man page and completions are drift-guarded by tests in this run.
  # -race is not on yet: cmd has an order-dependent data race under -race
  # (color.NoColor); enable it once that is fixed.
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test (-short, shuffled)
        run: go test -short -shuffle=on ./...

  # Full suite with -coverpkg=./... and the IQ_COVER_MIN floor (scripts/coverage.sh).
  # No IQ_*_URL is set except HBase's, so every other driver's TestMain provisions
  # its own testcontainer and -p=1 keeps that to one container at a time. HBase
  # has no testcontainers path (native RPC needs the region server's advertised
  # hostname), so its compose service runs with host networking for the whole
  # run; it binds fixed host ports no testcontainer uses, and -p=1 means only its
  # own package talks to it while it is the one container busy.
  coverage:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start HBase (compose, host networking)
        run: docker compose up -d --wait hbase
      - name: Test with coverage (one container at a time) + floor
        env:
          GOFLAGS: -p=1
          IQ_HBASE_URL: hbase://localhost:2181/
        run: bash scripts/coverage.sh
      # Reporting only, the floor above is the gate. Guarded to the GitHub mirror:
      # marketplace actions beyond checkout/setup-go are not mirrored elsewhere.
      - name: Upload coverage to Codecov
        if: startsWith(github.server_url, 'https://github.com')
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Black-box run of the built binary (package e2e). The two live flows need a
  # backend each and skip when its IQ_*_URL is unset, so they run in two passes with
  # a single compose service up at a time.
  e2e:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: e2e with redis (all cases + the redis live flow)
        run: |
          docker compose up -d --wait redis
          IQ_REDIS_URL=redis://localhost:6379/0 go test ./e2e/
          docker compose stop redis
      - name: e2e mongo live flow
        run: |
          docker compose up -d --wait mongo
          IQ_MONGO_URL=mongodb://localhost:27017/iq_test go test ./e2e/ -run TestLiveMongoRoundTrip
          docker compose stop mongo

  cross:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Cross-compile gate (no CGO, trimpath)
        run: |
          for os in linux darwin windows; do
            echo "== GOOS=$os CGO_ENABLED=0 =="
            CGO_ENABLED=0 GOOS="$os" go build -trimpath ./...
          done

  vuln:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  # OSV complements govulncheck: the whole dependency graph regardless of symbol
  # reachability, and --licenses gates every dependency against the allowlist.
  osv:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: OSV scan + license allowlist
        run: |
          go run github.com/google/osv-scanner/v2/cmd/osv-scanner@${{ env.OSV_SCANNER_VERSION }} \
            scan source --licenses=${{ env.LICENSE_ALLOWLIST }} -L go.mod

  # Generation-only: proves the SBOMs build (same syft invocation as `make sbom`).
  # No artifact upload; actions/upload-artifact is not among the mirrored actions.
  sbom:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Generate SBOMs (syft, SPDX + CycloneDX)
        run: |
          mkdir -p dist
          go run github.com/anchore/syft/cmd/syft@${{ env.SYFT_VERSION }} scan dir:. -q \
            -o spdx-json=dist/sbom.spdx.json -o cyclonedx-json=dist/sbom.cdx.json

  # Whole-program dead code: a function reachable from neither main nor any test.
  deadcode:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Dead code (whole program)
        run: |
          out="$(go run golang.org/x/tools/cmd/deadcode@${{ env.DEADCODE_VERSION }} -test ./...)"
          if [ -n "$out" ]; then echo "$out"; echo "::error::dead code: delete it or wire it up"; exit 1; fi

  secrets:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the full commit history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gitleaks (working tree + history)
        run: |
          go run github.com/zricethezav/gitleaks/v8@${{ env.GITLEAKS_VERSION }} dir --no-banner .
          go run github.com/zricethezav/gitleaks/v8@${{ env.GITLEAKS_VERSION }} git --no-banner .

  # What the dependency tree can *do* (google/capslock, scripts/capabilities.sh).
  # The wrapper self-skips unless go.mod or go.sum moved against the base, so this
  # is usually a few seconds; a real run peaks around 7 GB RSS.
  capabilities:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] the step below fetches the PR base
        with:
          fetch-depth: 0 # the merge-base with the trunk must be reachable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Capability drift vs capslock-baseline.json
        env:
          BASE: ${{ github.base_ref || 'main' }} # PR target branch, else the trunk
        run: |
          git fetch --no-tags origin "$BASE"
          IQ_CAPS_BASE="origin/$BASE" bash scripts/capabilities.sh

  # Mutation feedback scoped to the change (scripts/mutation-gate.sh): mutates only
  # lines changed vs the trunk and enumerates only the packages holding them.
  # BLOCKING: an escaped mutant on a changed covered line, or an errored/timed-out
  # mutant, fails the job; a genuine equivalent goes into mutago-baseline.json with
  # a note. Driver packages provision their testcontainer per test run, so with
  # --workers 1 and -p=1 there is one container at a time. The `deep-*` jobs run
  # the whole repo on a cadence, one package per runner.
  mutate-diff:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] the step below fetches the PR base
        with:
          fetch-depth: 0 # full history so the diff base is reachable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Mutation testing (scoped to the change, one container at a time)
        env:
          BASE: ${{ github.base_ref || 'main' }} # PR target branch, else the trunk
          GOFLAGS: -p=1
        run: |
          git fetch --no-tags origin "$BASE"
          IQ_MUTATION_BASE="origin/$BASE" bash scripts/mutation-gate.sh

  # Weekly + manual deep scan, four jobs gated to schedule/workflow_dispatch:
  # deep-scan re-runs the vulnerability scanners against fresh OSV/CVE data on
  # unchanged code and the secret history; deep-enumerate lists every package
  # with Go sources; deep-mutate runs the whole mutation gate for ONE package per
  # runner (the package-arg form of the wrapper, a full scan of that package with
  # its own containers on its own machine, so nothing is shared and the rule of
  # one container at a time still holds per runner); deep-badge sums the
  # per-package summaries into the module MSI and publishes the README badge.
  # Parallelism is across runners, never inside one: a driver package boots a
  # JVM-sized container per test run and a 16 GB runner cannot hold two of them
  # without the timeouts the gate treats as failures.
  deep-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Vulnerabilities (govulncheck + OSV, fresh data)
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...
          go run github.com/google/osv-scanner/v2/cmd/osv-scanner@${{ env.OSV_SCANNER_VERSION }} \
            scan source --licenses=${{ env.LICENSE_ALLOWLIST }} -L go.mod
      - name: Secret history scan
        run: go run github.com/zricethezav/gitleaks/v8@${{ env.GITLEAKS_VERSION }} git --no-banner .
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # The online audits read the advisory data of GitHub, so a re-run on
      # unchanged workflows finds a newly vulnerable or yanked action.
      - name: zizmor (GitHub Actions workflow audit, fresh data)
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx "zizmor==$ZIZMOR_VERSION" .github/

  deep-enumerate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Every package with a non-test Go file, as the ./relative form the wrapper
      # takes. A package with nothing to mutate (a doc.go, no tests) passes in a
      # minute with a zero summary, so nothing is filtered by hand.
      - id: list
        run: |
          pkgs="$(go list -f '{{if .GoFiles}}{{.ImportPath}}{{end}}' ./... \
            | sed "s|^$(go list -m)|.|" | jq -R . | jq -sc .)"
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"
          echo "$pkgs"

  deep-mutate:
    needs: deep-enumerate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false # every package reports; one red package does not hide the others
      max-parallel: 8
      matrix:
        package: ${{ fromJSON(needs.deep-enumerate.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Start the package's backing service(s) from compose ONCE and point the
      # IQ_*_URL override at them: with the env set, every per-mutant test run
      # reuses the running service instead of booting a fresh testcontainer,
      # which is what lets a driver package finish inside the job timeout (the
      # 8.17/2.17 JVM pairs cost ~a minute per boot). This mirrors the local
      # per-driver recipe; only this package's services run on this runner.
      # Couchbase ships unprovisioned, so the seed script's idempotent
      # cluster-init/bucket/index runs with the integration bucket and no
      # sample data. HBase needs host networking (native RPC hands back the
      # region server's advertised hostname).
      - name: Start the package's backend (compose)
        env:
          PKG: ${{ matrix.package }}
        run: |
          case "$PKG" in
            ./cmd)                   svcs="redis mongo"
              echo "IQ_REDIS_URL=redis://localhost:6379/0" >> "$GITHUB_ENV"
              echo "IQ_MONGO_URL=mongodb://localhost:27017/iq_test" >> "$GITHUB_ENV" ;;
            ./drivers/redis)         svcs="redis"
              echo "IQ_REDIS_URL=redis://localhost:6379/0" >> "$GITHUB_ENV" ;;
            ./drivers/mongo)         svcs="mongo"
              echo "IQ_MONGO_URL=mongodb://localhost:27017/iq_test" >> "$GITHUB_ENV" ;;
            ./drivers/cassandra)     svcs="cassandra"
              echo "IQ_CASSANDRA_URL=cassandra://localhost:9042/iq_test" >> "$GITHUB_ENV" ;;
            ./drivers/dynamodb)      svcs="dynamodb"
              echo "IQ_DYNAMODB_URL=dynamodb://us-east-1/?endpoint=http://localhost:8000" >> "$GITHUB_ENV" ;;
            ./drivers/hbase)         svcs="hbase"
              echo "IQ_HBASE_URL=hbase://localhost:2181/" >> "$GITHUB_ENV" ;;
            ./drivers/couchdb)       svcs="couchdb"
              echo "IQ_COUCHDB_URL=couchdb://admin:password@localhost:5984/" >> "$GITHUB_ENV" ;;
            ./drivers/couchbase)     svcs="couchbase"
              echo "IQ_COUCHBASE_URL=couchbase://Administrator:password@localhost/?bucket=iq_test" >> "$GITHUB_ENV" ;;
            ./drivers/neo4j)         svcs="neo4j"
              echo "IQ_NEO4J_URL=neo4j://neo4j:password@localhost:7687/" >> "$GITHUB_ENV" ;;
            ./drivers/elasticsearch) svcs="elasticsearch opensearch"
              echo "IQ_ELASTICSEARCH_URL=elasticsearch://localhost:9200/" >> "$GITHUB_ENV"
              echo "IQ_OPENSEARCH_URL=opensearch://localhost:9201/" >> "$GITHUB_ENV" ;;
            *)                       svcs="" ;;
          esac
          if [ -n "$svcs" ]; then
            docker compose up -d --wait $svcs
          fi
          if [ "$PKG" = "./drivers/couchbase" ]; then
            IQ_SEED_BUCKET=iq_test IQ_SEED_DATA=0 bash scripts/seed-couchbase.sh
          fi
      # The package-arg form drops the diff scoping: a full scan of this package
      # against the committed baseline. The wrapper writes mutago-summary.json.
      - name: Mutation testing (${{ matrix.package }})
        env:
          GOFLAGS: -p=1
          PKG: ${{ matrix.package }}
        run: bash scripts/mutation-gate.sh "$PKG"
      - name: Name the artifact after the package
        id: name
        env:
          PKG: ${{ matrix.package }}
        run: echo "slug=$(echo "$PKG" | tr '/.' '--' | sed 's/^-*//')" >> "$GITHUB_OUTPUT"
      # mutago-summary.json feeds deep-badge; mutago-agentic.json carries each
      # escaped mutant WITH its stable id, which is what IQ_MUTATION_MUTANT takes,
      # so hardening a package starts by downloading this artifact rather than by
      # re-deriving ids from a log.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-${{ steps.name.outputs.slug || 'root' }}
          path: |
            mutago-summary.json
            mutago-agentic.json
          if-no-files-found: error
          retention-days: 7

  # Publish the covered-code MSI as a shields.io endpoint badge, force-pushed as
  # the one-file `badges` branch of this same repo (README reads it via
  # raw.githubusercontent.com). `needs` is the guard: a red package never reaches
  # here, so the previous week's badge simply stays. Guarded to the GitHub mirror
  # like the Codecov upload. The merged mutago-summary.json carries
  # {..., "coveredCodeMsi": 0.97...} as a 0..1 fraction; the gate itself is
  # zero-survivor on covered code, so the colour bands sit high.
  deep-badge:
    needs: deep-mutate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: write lets the badge step force-push the one-file `badges`
    # branch with the standard GITHUB_TOKEN.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-*
          path: summaries
      - name: Merge the per-package summaries
        run: bash scripts/mutation-summary.sh summaries
      - name: Publish mutation badge
        if: startsWith(github.server_url, 'https://github.com')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pct="$(jq -rn --argjson m "$(jq '.coveredCodeMsi' mutago-summary.json)" '($m * 1000 | round) / 10')"
          color="$(jq -rn --argjson p "$pct" 'if $p < 90 then "red" elif $p < 95 then "yellow" else "brightgreen" end')"
          tmp="$(mktemp -d)"
          jq -n --argjson p "$pct" --arg c "$color" \
            '{schemaVersion: 1, label: "mutation", message: "\($p)% covered", color: $c}' \
            > "$tmp/mutation.json"
          cd "$tmp"
          git init -q -b badges
          git config user.name  "ci"
          git config user.email "ci@iq"
          git add mutation.json
          git commit -qm "ci: mutation badge from ${GITHUB_SHA}"
          scheme="${GITHUB_SERVER_URL%%://*}"
          host="${GITHUB_SERVER_URL#*://}"
          git push --force "${scheme}://x-access-token:${GITHUB_TOKEN}@${host}/${GITHUB_REPOSITORY}.git" badges

  # The README GIF is a recording of iq's output, and nothing in a build tells you when
  # the code it shows has moved on. The stamp is the hash of the sources it was
  # recorded from, and re-hashing them needs git and sha256sum only, so this gate runs
  # here even though none of the recorder (expect, asciinema, agg, a patched Nerd Font)
  # is installed; recording stays manual, catching staleness does not.
  demo-check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Demo stamp
        run: bash scripts/demo/stamp.sh check

  # Build the Zensical docs site on every change so a broken page fails the PR;
  # docs.yml owns the GitHub Pages deploy on pushes to main.
  docs:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build site
        run: uv run --locked zensical build --clean
        working-directory: docs
