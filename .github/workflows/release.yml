# Release workflow. GitHub Actions syntax; the primary self-hosted server executes
# .github/workflows/ too, so the job is guarded to run only on the GitHub mirror
# (goreleaser publishes to GitHub Releases and pushes the Homebrew/Scoop manifests
# to the tap/bucket repos — none of which exist on the primary remote). Triggered by a v* tag
# pushed to the `github` remote. Keep GORELEASER_VERSION in sync with the Makefile.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GORELEASER_VERSION: v2.17.0

jobs:
  goreleaser:
    # Skip on the primary remote (it has no GitHub Releases / tap / bucket).
    if: startsWith(github.server_url, 'https://github.com')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
      id-token: write # keyless cosign signature of checksums.txt
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history + tags so goreleaser can build the changelog
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release build must not read a cache that another run wrote
      # cosign signs checksums.txt inside goreleaser (the signs: stanza).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # The official action installs the pinned GoReleaser release and verifies its
      # checksum. OpenSSF Scorecard recognizes it as a packaging workflow.
      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          # GITHUB_TOKEN publishes the Release on this repo; GORELEASER_TOKEN is a
          # PAT with write access to the shared homebrew-tap and scoop-bucket repos.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_TOKEN: ${{ secrets.GORELEASER_TOKEN }}
      # The provenance job needs the SHA-256 of every release artifact: the lines of
      # checksums.txt, base64-encoded as one output.
      - name: Artifact hashes for provenance
        id: hashes
        env:
          ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
        run: |
          set -euo pipefail
          checksums="$(jq -r '.[] | select(.type == "Checksum") | .path' <<<"$ARTIFACTS")"
          echo "hashes=$(base64 -w0 "$checksums")" >> "$GITHUB_OUTPUT"

  # SLSA level 3 build provenance for every artifact in checksums.txt, uploaded to
  # the release as multiple.intoto.jsonl. The generator must be referenced by tag,
  # not by commit SHA: it verifies its own identity from the tag (slsa-verifier
  # checks it), and OpenSSF Scorecard accepts this one exception to pinning.
  provenance:
    needs: goreleaser
    permissions:
      actions: read # read the workflow run for the provenance
      id-token: write # sign the provenance through Sigstore
      contents: write # upload the provenance to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses] the generator must be referenced by tag, see the comment above
    with:
      base64-subjects: ${{ needs.goreleaser.outputs.hashes }}
      upload-assets: true

  # goreleaser publishes the Release with GITHUB_TOKEN, and an event that this
  # token causes starts no other workflow. So the install smoke test is called
  # here, after the publish, for the tag of this run.
  smoke:
    needs: goreleaser
    permissions:
      contents: read
    uses: $/.github/workflows/install-smoke.yml
    with:
      tag: ${{ github.ref_name }}
