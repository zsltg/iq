# Install smoke test: proves a published release installs and runs through the
# paths a user takes, on a fresh hosted runner (only install.sh is checked out): the
# Homebrew cask on macOS, the Scoop manifest on Windows, install.sh, the .deb and
# `go install` on Linux. Every path ends in the same black-box check: the
# binary reports the release tag, registers a dump as a source and queries it.
# The Release workflow calls it after goreleaser (workflow_call). A release that
# GITHUB_TOKEN publishes starts no other workflow, so the release trigger below
# fires only for a release that a person publishes. It also runs on demand (tag
# input, default latest). It needs the repo, the tap and the bucket to be public. Actions are pinned by commit SHA (Scorecard).
name: Install smoke

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to verify (e.g. v0.37.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify (e.g. v0.35.0); empty means the latest release
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: read # gh release download of the .deb

env:
  # The tag under test; resolved to the latest release below when empty.
  # A release build prints the version without the v prefix (${IQ_TAG#v}).
  # A go install build prints the module version, which keeps the v.
  IQ_TAG: ${{ inputs.tag || github.event.release.tag_name }}
  # The black-box check every install path ends in, run with bash -c "$SMOKE":
  # the installed binary registers a dump as a source and queries it.
  SMOKE: |
    set -eu
    dir="$(mktemp -d)"
    printf '{"key":"alpha","value":"hello-iq"}\n{"key":"beta","value":"world-iq"}\n' > "$dir/data.jsonl"
    export IQ_CONFIG="$dir/iq.toml"
    iq add "file://$dir/data.jsonl" -n snap
    iq --src snap '.[]' | tee "$dir/out"
    grep -q hello-iq "$dir/out" && grep -q world-iq "$dir/out"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (block egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.github.com:443
            dl.google.com:443
            github.com:443
            go.dev:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
      - name: Resolve tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${IQ_TAG:-$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)}"
          echo "IQ_TAG=$tag" >> "$GITHUB_ENV"
          echo "verifying $tag"
      # install.sh comes from this commit through a sparse checkout, not from a
      # download piped into sh: the script run is the one the commit holds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: install.sh
          sparse-checkout-cone-mode: false
      - name: install.sh
        run: |
          IQ_VERSION="$IQ_TAG" IQ_INSTALL_DIR="$HOME/.local/bin" sh ./install.sh
          "$HOME/.local/bin/iq" --version
          test "$("$HOME/.local/bin/iq" --version)" = "${IQ_TAG#v}"
          rm -f "$HOME/.local/bin/iq"
      - name: .deb package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$IQ_TAG" -R "$GITHUB_REPOSITORY" -p 'iq_*_linux_amd64.deb' -D pkg
          sudo dpkg -i pkg/iq_*_linux_amd64.deb
          test "$(iq --version)" = "${IQ_TAG#v}"
          man -w iq
          sudo dpkg -r iq
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false # a one-off `go install` needs no cache
      - name: go install
        run: |
          go install "github.com/zsltg/iq@$IQ_TAG"
          test "$("$(go env GOPATH)/bin/iq" --version)" = "$IQ_TAG"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Query a dump
        run: bash -c "$SMOKE"

  macos:
    runs-on: macos-latest
    steps:
      - name: Resolve tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${IQ_TAG:-$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)}"
          echo "IQ_TAG=$tag" >> "$GITHUB_ENV"
          echo "verifying $tag"
      - name: Homebrew cask
        run: |
          brew install zsltg/tap/iq
          test "$(iq --version)" = "${IQ_TAG#v}"
      - name: Query a dump (brew)
        run: bash -c "$SMOKE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: install.sh
          sparse-checkout-cone-mode: false
      - name: install.sh
        run: |
          brew uninstall iq
          IQ_VERSION="$IQ_TAG" IQ_INSTALL_DIR="$HOME/.local/bin" sh ./install.sh
          test "$("$HOME/.local/bin/iq" --version)" = "${IQ_TAG#v}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Query a dump (install.sh)
        run: bash -c "$SMOKE"

  windows:
    runs-on: windows-latest
    steps:
      - name: Resolve tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:IQ_TAG) { $env:IQ_TAG } else { gh release view -R $env:GITHUB_REPOSITORY --json tagName -q .tagName }
          "IQ_TAG=$tag" >> $env:GITHUB_ENV
          "verifying $tag"
      - name: Scoop manifest
        shell: pwsh
        run: |
          Invoke-Expression "& {$(Invoke-RestMethod get.scoop.sh)} -RunAsAdmin"
          $shims = Join-Path $HOME 'scoop\shims'
          $env:PATH = "$shims;$env:PATH"
          scoop bucket add zsltg https://github.com/zsltg/scoop-bucket
          scoop install iq
          $v = (iq --version | Out-String).Trim()
          if ($v -ne $env:IQ_TAG.TrimStart('v')) { throw "iq --version printed '$v', expected '$($env:IQ_TAG.TrimStart('v'))'" }
          $shims >> $env:GITHUB_PATH
      - name: Query a dump
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Set-Content -Path "$dir\data.jsonl" -Value "{`"key`":`"alpha`",`"value`":`"hello-iq`"}`n{`"key`":`"beta`",`"value`":`"world-iq`"}" -NoNewline
          $env:IQ_CONFIG = "$dir\iq.toml"
          $url = 'file:///' + ("$dir\data.jsonl" -replace '\\', '/')
          iq add $url -n snap
          $out = (iq --src snap '.[]' | Out-String)
          $out
          if ($out -notmatch 'hello-iq' -or $out -notmatch 'world-iq') { throw 'query output missing the dump values' }
