# OpenSSF Scorecard: scores the repository's security posture (pinned
# dependencies, token permissions, branch protection, security policy, ...)
# and uploads the result as SARIF to the Security tab. publish_results feeds
# the README badge from api.securityscorecards.dev, which only works for a
# public repository on github.com; the action refuses to run anywhere else, so
# this workflow is inert on any other forge.
name: Scorecard

on:
  push:
    branches:
      - main
  schedule:
    - cron: '32 6 * * 1' # Mondays 06:32 UTC
  workflow_dispatch:

# The analysis job below declares every permission it needs.
permissions:
  contents: read

jobs:
  analysis:
    if: github.repository == 'zsltg/iq'
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # sign the published results
      contents: read
      actions: read
    steps:
      - name: Harden the runner (block egress)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.deps.dev:443
            api.github.com:443
            api.osv.dev:443
            api.scorecard.dev:443
            codeload.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            www.bestpractices.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
