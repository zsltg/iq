# CodeQL static analysis (SAST) of the Go code, with the results in the
# repository's Security tab. It runs on every pull request and every push to
# main, so that OpenSSF Scorecard sees SAST on every commit, and weekly against
# the newest CodeQL queries. It is not a required check: golangci-lint (with
# gosec) and govulncheck in ci.yml remain the gates, and a CodeQL alert is read
# and closed in the Security tab. Actions are pinned by commit SHA (Scorecard).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 1' # Mondays 04:41 UTC

permissions:
  contents: read

jobs:
  analyze:
    if: github.repository == 'zsltg/iq'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
      actions: read # read the workflow run for the upload
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          build-mode: autobuild
          queries: security-and-quality
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:go
