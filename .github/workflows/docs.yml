name: Documentation
# Build the Zensical docs site (docs/) with uv against the committed lock and
# deploy it to GitHub Pages. Inert on the primary remote. If that server
# ever enables Actions this file would be parsed there and the deploy step would
# fail harmlessly (disable it per-repo to keep the log quiet).
on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - scripts/docs.sh
      - .github/workflows/docs.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The same entry point as `make docs`, so CI also writes llms-full.txt.
      - run: bash scripts/docs.sh build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
