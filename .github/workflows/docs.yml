name: Documentation
# Build the Zensical docs site (docs/) with uv against the committed lock and
# deploy it to GitHub Pages. Inert on the primary remote. If that server
# ever enables Actions this file would be parsed there and the deploy step would
# fail harmlessly (disable it per-repo to keep the log quiet).
on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8
      - uses: actions/configure-pages@v6
      - run: uv run --locked zensical build --clean
        working-directory: docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site
      - uses: actions/deploy-pages@v5
        id: deployment
