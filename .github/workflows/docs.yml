name: Documentation
# Build the Zensical docs site (docs/) with uv against the committed lock and
# deploy it to GitHub Pages. Inert on the primary remote. If that server
# ever enables Actions this file would be parsed there and the deploy step would
# fail harmlessly (disable it per-repo to keep the log quiet).
on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - scripts/docs.sh
      - .github/workflows/docs.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # publish the Pages artifact
      id-token: write # the Pages deploy uses OIDC
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The same entry point as `make docs`, so CI also writes llms-full.txt.
      - run: bash scripts/docs.sh build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
