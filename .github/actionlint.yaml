# actionlint finds this file by itself. It has no inline ignore comment, so an
# accepted finding without an inline form goes here, scoped to one file.
paths:
  .github/workflows/release.yml:
    ignore:
      # The smoke job calls install-smoke.yml with the form `$/.github/...`.
      # zizmor asks for this self-repository form, and the v0.37.1 release ran with
      # it. actionlint does not know the form, so it reports a bad format.
      - 'reusable workflow call "\$/\.github/workflows/install-smoke\.yml" .* not following the format'
